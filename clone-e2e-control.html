<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clone E2E Control</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #241712; }
    input, button { width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0; }
    button { cursor: pointer; font-weight: 700; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Clone E2E Control</h1>
  <p>Chỉ xử lý bill <code>__clone_factory_test_bill_20260809.png</code> trên Supabase Clone.</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD Clone">
  <button type="button" onclick="run('status')">1. Kiểm tra trạng thái</button>
  <button type="button" onclick="run('approve')">2. Duyệt order test</button>
  <button type="button" onclick="run('cleanup')">3. Dọn dữ liệu test</button>
  <pre id="output">Chưa chạy.</pre>
  <script>
    async function run(action) {
      const password = document.getElementById('password').value;
      const output = document.getElementById('output');
      output.textContent = 'Đang xử lý...';
      try {
        const response = await fetch('/api/clone-e2e-control?action=' + encodeURIComponent(action), {
          headers: { 'X-Admin-Password': password },
          cache: 'no-store'
        });
        const data = await response.json();
        output.textContent = JSON.stringify({ httpStatus: response.status, ...data }, null, 2);
      } catch (error) {
        output.textContent = JSON.stringify({ success: false, error: error.message }, null, 2);
      }
    }
  </script>
</body>
</html>
