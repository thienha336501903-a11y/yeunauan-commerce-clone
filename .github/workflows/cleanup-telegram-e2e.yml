name: Cleanup Telegram E2E

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/cleanup-telegram-e2e.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow

      - name: Install Vercel CLI and link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel project inspect --token="$VERCEL_TOKEN" >/dev/null

      - name: Deploy cleanup Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREVIEW_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Cleanup Preview: $PREVIEW_URL"

      - name: Execute exact Telegram E2E cleanup
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "$PREVIEW_URL/api/e2e-cleanup-telegram" -X POST > /tmp/cleanup.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cleanup.json','utf8'));if(!j.success){console.error(j);process.exit(1)};console.log('Cleanup PASS', {inviteRevoked:j.inviteRevoked,billRemoved:j.billRemoved,orderDeleted:j.orderDeleted,courseDeleted:j.courseDeleted,alreadyCleaned:j.alreadyCleaned});"
