name: Preview Telegram Sales Copy

on:
  push:
    branches:
      - fix/telegram-sales-copy-v2
    paths:
      - .github/workflows/preview-telegram-sales-copy.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-sales-copy-v2
          fetch-depth: 0
      - name: Static regression checks
        run: |
          set -euo pipefail
          node --check api/register.js
          node --check api/orders.js
          node --check utils/telegram.js
          git diff --check origin/main...HEAD
          grep -q "Telegram nhận khóa học" index.html
          grep -q "Tên Nick Telegram của bạn" index.html
          grep -q "telegram_claimed_username" api/register.js
          grep -q "customer_email: deliveryMode === 'lms' ? cleanEmail : null" api/register.js
      - name: Install Vercel CLI and link Clone project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel project inspect --token="$VERCEL_TOKEN" >/dev/null
      - name: Deploy Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PREVIEW_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview: $PREVIEW_URL"
      - name: Runtime read-only checks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel curl "$PREVIEW_URL/api/config?course=cagiatay" -s > /tmp/tg.json
          vercel curl "$PREVIEW_URL/api/config?course=banhmi4k" -s > /tmp/lms.json
          vercel curl "$PREVIEW_URL/?course=cagiatay" -s > /tmp/page.html
          node <<'NODE'
          const tg=require('/tmp/tg.json');
          const lms=require('/tmp/lms.json');
          if(tg.deliveryMode!=='telegram') throw new Error('cagiatay is not Telegram in Preview');
          if(lms.deliveryMode!=='lms') throw new Error('banhmi4k is not LMS in Preview');
          const fs=require('fs'); const html=fs.readFileSync('/tmp/page.html','utf8');
          for(const x of ['Telegram nhận khóa học','Nhập nick Telegram của bạn','Tên Nick Telegram của bạn','window.currentDeliveryMode']) if(!html.includes(x)) throw new Error('Missing '+x);
          console.log('Preview Telegram/LMS copy checks PASS');
          NODE
