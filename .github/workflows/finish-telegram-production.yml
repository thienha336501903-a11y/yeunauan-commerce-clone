name: Finish Telegram Production

on:
  push:
    branches:
      - ops/promote-telegram-production-20260812
    paths:
      - .github/workflows/finish-telegram-production.yml

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
      CANONICAL_URL: https://yeunauan-commerce-clone.vercel.app
    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4
        with:
          ref: ops/promote-telegram-production-20260812

      - name: Install Vercel CLI and link Clone project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel project inspect --token="$VERCEL_TOKEN" >/dev/null

      - name: Deploy protected operational Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PREVIEW_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Operational Preview: $PREVIEW_URL"

      - name: Set and verify canonical Telegram webhook
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel curl "$PREVIEW_URL/api/telegram-setup" -X POST > /tmp/setup.json
          node <<'NODE'
          const j=require('/tmp/setup.json');
          if(!j.success) throw new Error('Telegram setup failed: '+JSON.stringify(j));
          if(j.bot?.username !== 'yeunauan_course_bot') throw new Error('Unexpected bot username');
          if(j.webhook !== true) throw new Error('setWebhook did not return true');
          if(j.webhookInfo?.url !== 'https://yeunauan-commerce-clone.vercel.app/api/telegram-webhook') throw new Error('Webhook URL mismatch: '+j.webhookInfo?.url);
          const allowed=j.webhookInfo?.allowedUpdates || [];
          for(const x of ['message','chat_join_request','callback_query']) if(!allowed.includes(x)) throw new Error('Missing allowed update: '+x);
          console.log('Telegram canonical webhook PASS');
          NODE

      - name: Canonical smoke tests
        run: |
          set -euo pipefail
          ROOT_CODE=$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/root.html -w '%{http_code}' "$CANONICAL_URL/")
          test "$ROOT_CODE" = "200"
          curl --retry 5 --retry-delay 2 --retry-all-errors --fail-with-body -sS "$CANONICAL_URL/api/config?course=banhmi4k" > /tmp/config.json
          node -e "const j=require('/tmp/config.json'); if(j.course!=='banhmi4k'||j.deliveryMode!=='lms') throw new Error(JSON.stringify(j));"
          WEBHOOK_CODE=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/webhook-no-secret.json -w '%{http_code}' "$CANONICAL_URL/api/telegram-webhook")
          test "$WEBHOOK_CODE" = "401"
          echo "Canonical Production smoke PASS"
