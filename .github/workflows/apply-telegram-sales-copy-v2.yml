name: Apply Telegram Sales Copy V2

on:
  push:
    branches:
      - fix/telegram-sales-copy-v2
    paths:
      - .github/workflows/apply-telegram-sales-copy-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-sales-copy-v2
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-telegram-sales-copy.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check api/register.js
          node --check api/orders.js
          node --check utils/telegram.js
          python3 <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-scripts.js').write_text('\n;\n'.join(blocks))
          required=['Telegram nhận khóa học','Nhập nick Telegram của bạn','Tên Nick Telegram của bạn','telegramNick',"window.currentDeliveryMode"]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('missing index markers: '+repr(missing))
          PY
          node --check /tmp/index-scripts.js
          git diff --check
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "thienha336501903-a11y"
          git config user.email "thienha336501903@gmail.com"
          git add index.html api/register.js api/orders.js utils/telegram.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: adapt Telegram checkout copy and contact input"
          git push origin HEAD:fix/telegram-sales-copy-v2
