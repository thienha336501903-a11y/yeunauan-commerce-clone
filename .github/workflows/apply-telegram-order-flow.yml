name: Apply Telegram order flow

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - scripts/apply-telegram-order-flow.js
      - .github/workflows/apply-telegram-order-flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Telegram flow patch
        run: node scripts/apply-telegram-order-flow.js

      - name: Ensure crypto import in generated courses API
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'api/courses.js';
          let s = fs.readFileSync(p, 'utf8');
          const line = "import crypto from 'crypto';";
          if (!s.includes(line)) fs.writeFileSync(p, line + '\n' + s, 'utf8');
          NODE

      - name: Validate runtime files
        run: |
          node --check utils/telegram.js
          node --check api/config.js
          node --check api/register.js
          node --check api/orders.js
          node --check api/courses.js
          node --check api/telegram-webhook.js
          node --check api/telegram-setup.js
          git diff --check

      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api admin.html index.html utils migration_telegram_delivery_20260811.sql
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "feat: add per-order Telegram join flow"
          git push origin HEAD:agent/telegram-order-invite-flow

