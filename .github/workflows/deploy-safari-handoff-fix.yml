name: Deploy Safari Handoff Fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-safari-handoff-fix.yml]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate checkout handoff
        run: |
          node --check api/register.js
          grep -q "open-in-browser.html?registered=1&course=" api/register.js
          ! grep -q "const managerPath = '/my-courses.html?registered=1&course='" api/register.js
          git diff --check
      - name: Deploy Commerce Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@latest >/dev/null 2>&1
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-safari-handoff-fix.yml
          git commit -m "chore: remove Safari handoff deploy workflow"
          git push origin HEAD:main
