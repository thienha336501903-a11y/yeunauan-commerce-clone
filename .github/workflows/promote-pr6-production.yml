name: Promote PR6 Production

on:
  push:
    branches:
      - ops/promote-pr6-production-20260812
    paths:
      - .github/workflows/promote-pr6-production.yml

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
      EXPECTED_MAIN_SHA: 1f8501fc6eaf07308d1806db3c318a58b58a58e4
      CANONICAL_URL: https://yeunauan-commerce-clone.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact main commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git diff --check HEAD^..HEAD
          node --check api/register.js
          node --check api/orders.js
          node --check utils/telegram.js

      - name: Install Vercel CLI and link Clone project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel project inspect --token="$VERCEL_TOKEN" >/dev/null

      - name: Deploy Production canonical
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROD_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "PROD_URL=$PROD_URL" >> "$GITHUB_ENV"
          echo "Production deployment: $PROD_URL"

      - name: Canonical smoke tests
        run: |
          set -euo pipefail
          curl -fsS "$CANONICAL_URL/?course=cagiatay" > /tmp/page.html
          curl -fsS "$CANONICAL_URL/api/config?course=cagiatay" > /tmp/tg.json
          curl -fsS "$CANONICAL_URL/api/config?course=banhmi4k" > /tmp/lms.json
          node <<'NODE'
          const fs=require('fs');
          const tg=JSON.parse(fs.readFileSync('/tmp/tg.json','utf8'));
          const lms=JSON.parse(fs.readFileSync('/tmp/lms.json','utf8'));
          const html=fs.readFileSync('/tmp/page.html','utf8');
          if(tg.deliveryMode!=='telegram') throw new Error('Canonical cagiatay deliveryMode != telegram');
          if(lms.deliveryMode!=='lms') throw new Error('Canonical banhmi4k deliveryMode != lms');
          for(const marker of ['Telegram nhận khóa học','Nhập nick Telegram của bạn','Tên Nick Telegram của bạn','window.currentDeliveryMode']) {
            if(!html.includes(marker)) throw new Error('Canonical HTML missing marker: '+marker);
          }
          console.log('Canonical Telegram/LMS smoke PASS');
          NODE
