name: Apply Telegram one-click admin patch

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - scripts/apply-telegram-one-click.js
      - .github/workflows/apply-telegram-one-click.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow
          fetch-depth: 0

      - name: Apply admin patch
        run: node scripts/apply-telegram-one-click.js

      - name: Validate server JavaScript
        run: |
          node --check api/config.js
          node --check api/courses.js
          node --check api/register.js
          node --check api/orders.js
          node --check api/telegram-connect.js
          node --check api/telegram-setup.js
          node --check api/telegram-webhook.js
          node --check utils/telegram.js
          git diff --check

      - name: Commit generated admin change
        run: |
          if git diff --quiet -- admin.html; then
            echo "No admin.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "feat: add one-click Telegram course connection UI"
          git push origin HEAD:agent/telegram-order-invite-flow
