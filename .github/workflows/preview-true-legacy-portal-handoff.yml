name: Preview true legacy portal handoff

on:
  push:
    branches:
      - fix/true-legacy-portal-handoff
    paths:
      - .github/workflows/preview-true-legacy-portal-handoff.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/true-legacy-portal-handoff
      - name: Validate exact redirect diff
        run: |
          grep -F "window.location.href = 'https://yeunauan.live/my-courses';" index.html
          grep -F "window.location.href=targetLmsUrl+'/v4-entry.html?course='" index.html
          git diff --check origin/main...HEAD
      - name: Deploy Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@latest >/dev/null 2>&1
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" >/dev/null
          vercel deploy --yes --token="$VERCEL_TOKEN"
