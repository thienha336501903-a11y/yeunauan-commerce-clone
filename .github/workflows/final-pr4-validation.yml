name: Final PR4 Validation

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/final-pr4-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow
          fetch-depth: 0

      - name: Static validation
        run: |
          node --check api/config.js
          node --check api/courses.js
          node --check api/orders.js
          node --check api/register.js
          node --check api/telegram-connect.js
          node --check api/telegram-setup.js
          node --check api/telegram-webhook.js
          node --check utils/telegram.js
          git diff --check origin/main...HEAD
          grep -q "req.query.course || 'donut'" api/config.js

      - name: Install Vercel CLI and link Clone project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel env pull /tmp/preview-env --yes --environment=preview --token="$VERCEL_TOKEN"
          set -a
          source /tmp/preview-env
          set +a
          rm -f /tmp/preview-env
          test -n "${ADMIN_PASSWORD:-}"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Deploy latest branch Preview only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREVIEW_URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Latest Preview: $PREVIEW_URL"

      - name: Runtime regression checks with prefixed test course
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          COURSE_ID=""
          cleanup() {
            if [ -n "$COURSE_ID" ]; then
              printf '{"id":"%s"}\n' "$COURSE_ID" > /tmp/delete-course.json
              vercel curl "$PREVIEW_URL/api/courses" -X DELETE \
                -H "X-Admin-Password: $ADMIN_PASSWORD" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/delete-course.json >/tmp/delete-response.json || true
            fi
          }
          trap cleanup EXIT

          AUTH_CODE=$(vercel curl "$PREVIEW_URL/api/telegram-connect?courseId=00000000-0000-0000-0000-000000000000" -s -o /tmp/auth.json -w '%{http_code}')
          test "$AUTH_CODE" = "401"

          vercel curl "$PREVIEW_URL/api/config?course=banhmi4k" -s > /tmp/config.json
          node -e "const j=require('/tmp/config.json'); if(j.course!=='banhmi4k') process.exit(1);"

          cat >/tmp/create-course.json <<'JSON'
          {
            "slug":"__clone_factory_test_pr4_regression_20260811",
            "courseName":"__clone_factory_test PR4 Regression",
            "price":"12345",
            "imageUrl":"https://example.com/test.jpg",
            "active":true,
            "sort_order":9998,
            "description":"temporary regression test",
            "teacher_name":"__clone_factory_test",
            "bankName":"TEST",
            "bankAccount":"000",
            "bankOwner":"TEST",
            "transferNote":"TEST",
            "qrImageUrl":"",
            "deliveryMode":"telegram",
            "telegramChatId":"-1009999999999",
            "telegramChatTitle":"__clone_factory_test group",
            "telegramInviteTtlHours":123
          }
          JSON
          vercel curl "$PREVIEW_URL/api/courses" -X POST \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/create-course.json > /tmp/create-response.json
          COURSE_ID=$(node -e "const j=require('/tmp/create-response.json');if(!j.success||!j.data?.id)process.exit(1);process.stdout.write(j.data.id)")

          node - "$COURSE_ID" <<'NODE' >/tmp/legacy-put.json
          const id=process.argv[2];
          process.stdout.write(JSON.stringify({
            id,
            slug:'__clone_factory_test_pr4_regression_20260811',
            courseName:'__clone_factory_test PR4 Regression Updated',
            price:'12345',
            imageUrl:'https://example.com/test.jpg',
            active:true,
            sort_order:9998,
            description:'temporary regression test updated',
            teacher_name:'__clone_factory_test',
            bankName:'TEST',
            bankAccount:'000',
            bankOwner:'TEST',
            transferNote:'TEST',
            qrImageUrl:''
          }));
          NODE
          vercel curl "$PREVIEW_URL/api/courses" -X PUT \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/legacy-put.json > /tmp/put-response.json
          node <<'NODE'
          const j=require('/tmp/put-response.json');
          if(!j.success) throw new Error(JSON.stringify(j));
          const d=j.data || {};
          if(d.delivery_mode !== 'telegram') throw new Error('delivery_mode was not preserved');
          if(String(d.telegram_chat_id) !== '-1009999999999') throw new Error('telegram_chat_id was not preserved');
          if(d.telegram_chat_title !== '__clone_factory_test group') throw new Error('telegram_chat_title was not preserved');
          if(Number(d.telegram_invite_ttl_hours) !== 123) throw new Error('telegram TTL was not preserved');
          NODE

          cleanup
          COURSE_ID=""
          trap - EXIT
          echo "Runtime regression checks PASS"
