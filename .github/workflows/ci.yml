name: Commerce CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check api/courses.js
          node --check api/orders.js
          node --check api/register.js
          node --check api/approve-all.js
          node --check api/config.js
          node --check utils/delivery-policy.js
          node --check utils/sync-helpers.js
          node --check utils/v4-sync-helpers.js
          node --check utils/v5-sync-helpers.js
          node --check utils/v5-order-approval.js
          node --check utils/v5-readiness.js
      - name: Regression tests
        run: npm test
      - name: Clone configuration isolation
        run: npm run check:clone
