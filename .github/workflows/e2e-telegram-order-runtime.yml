name: Telegram Order Runtime E2E

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/e2e-telegram-order-runtime.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
      PREVIEW_URL: https://yeunauan-commerce-clone-8ongfdfxa.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI and link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel project inspect --token="$VERCEL_TOKEN" >/dev/null

      - name: Register Telegram test order through runtime API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node <<'NODE' > /tmp/register.json
          const png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZhwAAAABJRU5ErkJggg==';
          process.stdout.write(JSON.stringify({
            gmail: '__clone_factory_test_telegram_order_20260811@example.com',
            billName: '__clone_factory_test_bill_telegram_20260811.png',
            billType: 'image/png',
            billData: png,
            course: '__clone_factory_test_telegram_oneclick_20260811'
          }));
          NODE
          vercel curl "$PREVIEW_URL/api/register" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/register.json > /tmp/register-response.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/register-response.json','utf8'));
          if(!j.success) { console.error(j); process.exit(1); }
          if(j.deliveryMode !== 'telegram') { console.error('Expected telegram delivery', j); process.exit(1); }
          if(!j.orderId || !j.telegramInviteLink) { console.error('Missing order-specific invite', j); process.exit(1); }
          console.log('ORDER_ID=' + j.orderId);
          console.log('DELIVERY_MODE=' + j.deliveryMode);
          console.log('INVITE_URL=' + j.telegramInviteLink);
          console.log('INVITE_EXPIRES_AT=' + (j.telegramInviteExpiresAt || ''));
          NODE
