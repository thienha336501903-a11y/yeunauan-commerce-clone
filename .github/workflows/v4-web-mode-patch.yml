name: Patch V4 Web delivery mode

on:
  push:
    branches:
      - feat/v4-web-delivery-mode

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-web-delivery-mode
          fetch-depth: 0
      - name: Apply V4 Web delivery mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {found}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          replace(
              'admin.html',
              '<option value="lms">Học trên hệ thống LMS</option>\n            <option value="telegram">Học trên Telegram</option>',
              '<option value="lms">Học trên hệ thống LMS</option>\n            <option value="v4">Học trên V4 Web</option>\n            <option value="telegram">Học trên Telegram</option>'
          )

          replace(
              'api/courses.js',
              "const mode = value => value === 'telegram' ? 'telegram' : 'lms';",
              "const mode = value => { const normalized = String(value || '').trim().toLowerCase(); return ['lms', 'v4', 'telegram'].includes(normalized) ? normalized : 'lms'; };"
          )

          replace(
              'api/config.js',
              "const deliveryMode = course.delivery_mode === 'telegram' ? 'telegram' : 'lms';",
              "const normalizedDeliveryMode = String(course.delivery_mode || '').trim().toLowerCase();\n    const deliveryMode = ['lms', 'v4', 'telegram'].includes(normalizedDeliveryMode) ? normalizedDeliveryMode : 'lms';"
          )

          replace(
              'api/register.js',
              "const deliveryMode = courseRec.delivery_mode === 'telegram' ? 'telegram' : 'lms';",
              "const normalizedDeliveryMode = String(courseRec.delivery_mode || '').trim().toLowerCase();\n    const deliveryMode = ['lms', 'v4', 'telegram'].includes(normalizedDeliveryMode) ? normalizedDeliveryMode : 'lms';"
          )
          replace(
              'api/register.js',
              "return res.status(200).json({ success: true, file: billLink, course: courseSlug, courseName: finalCourseName, orderId, deliveryMode: 'lms' });",
              "return res.status(200).json({ success: true, file: billLink, course: courseSlug, courseName: finalCourseName, orderId, deliveryMode });"
          )

          replace(
              'index.html',
              "window.currentDeliveryMode=data.deliveryMode==='telegram'?'telegram':'lms';",
              "window.currentDeliveryMode=['telegram','v4'].includes(data.deliveryMode)?data.deliveryMode:'lms';"
          )
          replace(
              'index.html',
              "          console.log('[Checkout] redirecting to clone LMS portal');\n          const targetLmsUrl = (window.LMS_PUBLIC_URL || 'https://yeunauan-lms-clone.vercel.app').replace(/\\/$/, '');\n          window.location.href = targetLmsUrl;",
              "          const targetLmsUrl = (window.LMS_PUBLIC_URL || 'https://yeunauan-lms-clone.vercel.app').replace(/\\/$/, '');\n          if(data.deliveryMode==='v4'){\n            console.log('[Checkout] redirecting to V4 Web entry');\n            const courseSlug=data.course||new URLSearchParams(window.location.search).get('course')||'';\n            window.location.href=targetLmsUrl+'/v4-entry.html?course='+encodeURIComponent(courseSlug);\n          }else{\n            console.log('[Checkout] redirecting to clone LMS portal');\n            window.location.href = targetLmsUrl;\n          }"
          )

          Path('migration_v4_web_delivery_mode_20260818.sql').write_text("""-- Add V4 Web as a third Commerce delivery mode.\n-- Existing LMS and Telegram rows are unchanged.\n\nalter table public.courses drop constraint if exists courses_delivery_mode_check;\nalter table public.courses\n  add constraint courses_delivery_mode_check\n  check (delivery_mode in ('lms', 'v4', 'telegram'));\n\nalter table public.orders drop constraint if exists orders_delivery_mode_check;\nalter table public.orders\n  add constraint orders_delivery_mode_check\n  check (delivery_mode in ('lms', 'v4', 'telegram'));\n""")
          PY

          rm .github/workflows/v4-web-mode-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add V4 Web course delivery mode"
          git push origin HEAD:feat/v4-web-delivery-mode
