name: Check Vercel token

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/check-vercel-token.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify VERCEL_TOKEN exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi
          echo "VERCEL_TOKEN is present"
