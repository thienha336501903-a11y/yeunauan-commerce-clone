name: Patch V4 source endpoint

on:
  push:
    branches:
      - feat/v4-self-service-course-flow
    paths:
      - scripts/patch-v4-source-endpoint.mjs
      - .github/workflows/patch-v4-source-endpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-self-service-course-flow
      - name: Patch endpoint
        run: node scripts/patch-v4-source-endpoint.mjs
      - name: Validate
        run: |
          grep -q "/api/courses?action=v4-sources" admin.html
          if grep -q "/api/v4-sources" admin.html; then exit 1; fi
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reuse courses function for V4 source admin"
          git push origin HEAD:feat/v4-self-service-course-flow
