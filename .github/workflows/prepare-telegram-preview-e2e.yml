name: Prepare Telegram Preview E2E

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/prepare-telegram-preview-e2e.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
      PREVIEW_URL: https://yeunauan-commerce-clone-1m5xg85ri.vercel.app
      PREVIEW_BRANCH: agent/telegram-order-invite-flow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull branch-specific Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --git-branch="$PREVIEW_BRANCH" --token="$VERCEL_TOKEN"

      - name: Load Admin credential
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "ADMIN_PASSWORD missing from Preview env"
            exit 1
          fi
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Register Telegram webhook on Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "$PREVIEW_URL/api/telegram-setup" \
            -X POST \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/setup.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/setup.json','utf8'));if(!j.success){console.error(j);process.exit(1)};console.log('Webhook registered:',j.webhookUrl);"

      - name: Create prefixed Telegram test course
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cat > /tmp/course.json <<'JSON'
          {
            "slug": "__clone_factory_test_telegram_oneclick_20260811",
            "courseName": "__clone_factory_test Telegram One Click 20260811",
            "price": "0",
            "active": true,
            "sort_order": 9999,
            "description": "Temporary Clone E2E Telegram course",
            "deliveryMode": "telegram",
            "telegramInviteTtlHours": 72
          }
          JSON
          vercel curl "$PREVIEW_URL/api/courses" \
            -X POST \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/course.json > /tmp/course-response.json
          COURSE_ID=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/course-response.json','utf8'));if(!j.success||!j.data?.id){console.error(j);process.exit(1)};process.stdout.write(j.data.id)")
          echo "COURSE_ID=$COURSE_ID" >> "$GITHUB_ENV"
          echo "Created test course: $COURSE_ID"

      - name: Create one-click Telegram connect URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          printf '{"courseId":"%s"}\n' "$COURSE_ID" > /tmp/connect-request.json
          vercel curl "$PREVIEW_URL/api/telegram-connect" \
            -X POST \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/connect-request.json > /tmp/connect-response.json
          CONNECT_URL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/connect-response.json','utf8'));if(!j.success||!j.connectUrl){console.error(j);process.exit(1)};process.stdout.write(j.connectUrl)")
          echo "CONNECT_URL=$CONNECT_URL" >> "$GITHUB_ENV"
          echo "### Telegram E2E ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Course ID: $COURSE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Connect URL: $CONNECT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Connect URL: $CONNECT_URL"
