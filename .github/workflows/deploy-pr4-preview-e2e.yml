name: Deploy PR4 Telegram Preview E2E

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/deploy-pr4-preview-e2e.yml

permissions:
  contents: read

jobs:
  preview-e2e-setup:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_0HdK4TgrT3FydjCbv6p81809
      VERCEL_PROJECT_ID: prj_JOvxsmJLwcJhCa9qsBHYYuTvDoXA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow
          fetch-depth: 0

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN missing" && exit 1)

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link project and pull Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Validate branch before deploy
        run: |
          node --check api/config.js
          node --check api/courses.js
          node --check api/register.js
          node --check api/orders.js
          node --check api/telegram-connect.js
          node --check api/telegram-setup.js
          node --check api/telegram-webhook.js
          node --check utils/telegram.js
          git diff --check origin/main...HEAD

      - name: Deploy Preview only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "Preview URL: $URL"

      - name: Load Preview admin credential safely
        run: |
          test -f .vercel/.env.preview.local
          set -a
          source .vercel/.env.preview.local
          set +a
          test -n "$ADMIN_PASSWORD" || (echo "ADMIN_PASSWORD missing from Preview env" && exit 1)
          echo "::add-mask::$ADMIN_PASSWORD"
          printf '%s' "$ADMIN_PASSWORD" > /tmp/admin_password

      - name: Wait for Preview runtime
        run: |
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/health.out -w '%{http_code}' "$PREVIEW_URL/api/health" || true)
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              break
            fi
            sleep 2
          done

      - name: Register Telegram webhook on Preview
        run: |
          ADMIN_PASSWORD=$(cat /tmp/admin_password)
          response=$(curl -L -sS -X POST "$PREVIEW_URL/api/telegram-setup" \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            -d '{}')
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.success) { console.error(d); process.exit(1); } console.log(`Webhook ready: ${d.webhookUrl}`); console.log(`Bot: @${d.bot.username}`);' "$response"

      - name: Create prefixed Telegram test course
        id: testcourse
        run: |
          ADMIN_PASSWORD=$(cat /tmp/admin_password)
          TS=$(date +%s)
          SLUG="__clone_factory_test_telegram_oneclick_${TS}"
          payload=$(node -e 'console.log(JSON.stringify({slug:process.argv[1],courseName:"__clone_factory_test Telegram One-click",price:"1000đ",active:true,sort_order:9999,description:"Temporary E2E Telegram course",teacher_name:"__clone_factory_test",deliveryMode:"telegram",telegramInviteTtlHours:72,bankName:"TEST",bankAccount:"000",bankOwner:"TEST",transferNote:"TEST"}))' "$SLUG")
          response=$(curl -L -sS -X POST "$PREVIEW_URL/api/courses" \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "$response" > /tmp/test_course_response.json
          COURSE_ID=$(node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/test_course_response.json","utf8")); if(!d.success||!d.data?.id){console.error(d);process.exit(1)}; process.stdout.write(d.data.id)' )
          echo "course_id=$COURSE_ID" >> "$GITHUB_OUTPUT"
          echo "course_slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "TEST_COURSE_ID=$COURSE_ID" >> "$GITHUB_ENV"
          echo "TEST_COURSE_SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "Test course ID: $COURSE_ID"
          echo "Test course slug: $SLUG"

      - name: Create one-click Telegram connect URL
        id: connect
        run: |
          ADMIN_PASSWORD=$(cat /tmp/admin_password)
          response=$(curl -L -sS -X POST "$PREVIEW_URL/api/telegram-connect" \
            -H "X-Admin-Password: $ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            -d "{\"courseId\":\"$TEST_COURSE_ID\"}")
          echo "$response" > /tmp/connect_response.json
          CONNECT_URL=$(node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/connect_response.json","utf8")); if(!d.success||!d.connectUrl){console.error(d);process.exit(1)}; process.stdout.write(d.connectUrl)' )
          echo "connect_url=$CONNECT_URL" >> "$GITHUB_OUTPUT"
          echo "Telegram connect URL: $CONNECT_URL"

      - name: E2E setup summary
        run: |
          echo "PREVIEW_URL=$PREVIEW_URL"
          echo "TEST_COURSE_ID=$TEST_COURSE_ID"
          echo "TEST_COURSE_SLUG=$TEST_COURSE_SLUG"
          echo "NEXT=Open Telegram connect URL from previous step, press START, then choose group/channel."
