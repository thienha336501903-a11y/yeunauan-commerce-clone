name: Apply V5 Admin UI V2

on:
  push:
    branches:
      - fix/v5-go-live-hardening-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run guarded transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import textwrap

          historical = subprocess.check_output([
              'git', 'show',
              'b676ed9889bf367599e8a9e500ea50fd10ced837:.github/workflows/apply-v5-admin-ui.yml'
          ], text=True)
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if historical.count(start) != 1:
              raise SystemExit('historical Python start marker missing/ambiguous')
          body = historical.split(start, 1)[1].split(end, 1)[0]
          body = textwrap.dedent(body)
          compile(body, 'apply-v5-admin-ui.py', 'exec')
          exec(body, {'__name__': '__main__'})
          PY

          cat > test/v5-admin-ui-staged-patch.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const admin = fs.readFileSync(new URL('../admin.html', import.meta.url), 'utf8');

          test('Commerce admin explicitly represents LMS V5', () => {
            assert.match(admin, /<option value="v5">Học trên LMS V5<\/option>/);
            assert.match(admin, /id="v5CourseFields"/);
            assert.match(admin, /LMS V5/);
          });

          test('existing V5 mode is locked and content lifecycle opens canonical V5 Channel', () => {
            assert.match(admin, /deliveryModeInput\.disabled = editingV5/);
            assert.match(admin, /editingV5 = course\.deliveryMode === 'v5'/);
            assert.match(admin, /v5-admin\.html\?course=/);
            assert.match(admin, /Trạng thái nội dung canonical V5/);
          });

          test('V5 UI reads canonical readiness before sale activation', () => {
            assert.match(admin, /\/api\/config\?adminReadiness=1&course=/);
            assert.match(admin, /readiness\.canonicalReady/);
            assert.match(admin, /Published release hợp lệ/);
            assert.match(admin, /if \(!currentStatus && course\.deliveryMode === 'v5'\)/);
          });

          test('generic V5 content controls do not own V5 lifecycle', () => {
            assert.match(admin, /Nội dung LMS V5 được quản lý tại V5 Channel/);
            assert.match(admin, /openV5Channel\(course\.slug\)/);
            assert.match(admin, /course\.deliveryMode === 'v5' \? 'hidden'/);
          });
          EOF

          rm -f docs/patches/commerce-v5-admin-ui.patch
          rm -f .github/workflows/apply-v5-admin-ui.yml
          rm -f .github/workflows/apply-v5-admin-ui-v2.yml
          git diff --check
          npm ci
          npm test

      - name: Commit applied UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply Commerce V5 admin UI'
          git push origin HEAD:fix/v5-go-live-hardening-20260828
