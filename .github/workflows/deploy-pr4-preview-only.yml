name: Deploy PR4 Preview only

on:
  push:
    branches:
      - agent/telegram-order-invite-flow
    paths:
      - .github/workflows/deploy-pr4-preview-only.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cAthcmyw4079BDgelX0YjG9i
      VERCEL_PROJECT_ID: prj_9LIdNafm4JYpYCNA6ujbIlQs2Bh9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-order-invite-flow
          fetch-depth: 0

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"

      - name: Validate branch
        run: |
          node --check api/config.js
          node --check api/courses.js
          node --check api/register.js
          node --check api/orders.js
          node --check api/telegram-connect.js
          node --check api/telegram-setup.js
          node --check api/telegram-webhook.js
          node --check utils/telegram.js
          git diff --check origin/main...HEAD

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Preview project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy Preview only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "### Telegram PR #4 Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment mode: Preview only (no --prod)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test Preview
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -L -sS -o /tmp/preview.html -w '%{http_code}' "$PREVIEW_URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Preview HTTP 200"
              exit 0
            fi
            echo "Waiting for Preview: HTTP $CODE"
            sleep 4
          done
          echo "Preview did not return HTTP 200 in time"
          exit 1
