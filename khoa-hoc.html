<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pinterest Food Studio — Khóa học đang mở bán</title>
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Same look as the V5 course page (index.html): palette, fonts, pin cards, dotted background. */
:root{--bg:#faf7f2;--card:#fff;--cream:#fff3e5;--ink:#241712;--muted:#7a675c;--red:#b65c4b;--sage:#6f7d5a;--sand:#e9dfd2}
*{box-sizing:border-box}
body{margin:0;font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 8%,rgba(182,92,75,.12),transparent 25%),radial-gradient(circle at 92% 0%,rgba(111,125,90,.14),transparent 24%),linear-gradient(180deg,#faf7f2 0%,#f3ece2 100%);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(36,23,18,.14) .7px,transparent .8px);background-size:18px 18px;z-index:0}
.page{position:relative;z-index:1;max-width:80rem;margin:0 auto;padding:20px 16px 64px}
.serif{font-family:"DM Serif Display",Georgia,serif}
.mini-kicker{font-size:11px;letter-spacing:.19em;text-transform:uppercase;font-weight:900}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.1);padding:8px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05);color:var(--muted)}
.brand i{width:10px;height:10px;border-radius:999px;background:var(--red)}
.student{border-radius:999px;background:var(--ink);color:#fff7ef;padding:10px 20px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;text-decoration:none}
.student:hover{filter:brightness(1.08)}
.hero{margin:28px 0 22px}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:6px 0 10px;font-weight:400}
.hero p{color:var(--muted);margin:0;max-width:40rem;font-weight:600}
.masonry{column-count:3;column-gap:18px}
.masonry>*{break-inside:avoid;margin-bottom:18px}
@media(max-width:1024px){.masonry{column-count:2}}
@media(max-width:640px){.masonry{column-count:1}.student{padding:9px 14px;letter-spacing:.08em}}
.pin{display:block;background:#fff;border:1px solid rgba(36,23,18,.08);box-shadow:0 18px 44px rgba(36,23,18,.08);border-radius:34px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.pin:hover{transform:translateY(-2px);box-shadow:0 24px 58px rgba(36,23,18,.12)}
.pin:focus-visible,.student:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.poster{padding:12px;background:var(--cream)}
.poster img{display:block;width:100%;aspect-ratio:9/11;object-fit:contain;background:var(--cream);border-radius:26px}
.body{padding:18px 22px 22px}
.body h2{font-size:1.75rem;line-height:1.05;margin:6px 0 10px;font-weight:400}
.price{display:inline-block;border-radius:999px;background:#fff8f0;border:1px solid rgba(182,92,75,.2);color:var(--red);font-weight:900;padding:6px 12px;margin:0 0 10px}
.summary{color:var(--muted);font-size:.95rem;line-height:1.6;margin:0 0 16px}
.cta{display:block;text-align:center;border-radius:18px;background:var(--red);color:#fff;font-weight:900;padding:13px 16px;box-shadow:0 14px 30px rgba(182,92,75,.22)}
.pin:hover .cta{filter:brightness(1.06)}
.note{background:#fff;border:1px solid rgba(36,23,18,.08);box-shadow:0 18px 44px rgba(36,23,18,.08);border-radius:26px;padding:22px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="brand"><i></i><span class="mini-kicker">Pinterest Food Studio</span></span>
    <a id="student" class="student" href="#" hidden>Vào học</a>
  </header>
  <section class="hero">
    <p class="mini-kicker" style="color:var(--red)">Khóa học đang mở bán</p>
    <h1 class="serif">Chọn khóa học bạn muốn học</h1>
    <p>Bấm vào khóa học để xem nội dung, học phí và hướng dẫn đăng ký. Đã mua khóa học? Bấm "Vào học".</p>
  </section>
  <div id="list" class="masonry" aria-live="polite"><p class="note">Đang tải danh sách khóa học…</p></div>
</div>
<script>
(async () => {
  const list = document.getElementById('list');
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const note = (text) => { list.className = ''; list.replaceChildren(el('p', { className: 'note', textContent: text })); };
  fetch('/api/config?runtime=1', { cache: 'no-store' }).then((r) => r.json()).then((cfg) => {
    if (!cfg?.lmsPublicUrl) return;
    const a = document.getElementById('student');
    a.href = new URL('/my-courses.html', cfg.lmsPublicUrl).toString();
    a.hidden = false;
  }).catch(() => {});
  try {
    const res = await fetch('/api/config?catalog=1');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'catalog');
    if (data.closed || !data.courses?.length) return note('Hiện chưa có khóa học nào mở nhận đăng ký. Bạn quay lại sau nhé.');
    list.replaceChildren(...data.courses.map((c) => {
      const card = el('a', { className: 'pin', href: '/?course=' + encodeURIComponent(c.slug) });
      if (c.imageUrl) card.append(el('div', { className: 'poster' }, el('img', { src: c.imageUrl, alt: c.title, loading: 'lazy', decoding: 'async' })));
      const body = el('div', { className: 'body' }, el('p', { className: 'mini-kicker', textContent: 'Khóa học online' }));
      body.style.color = 'var(--ink)';
      body.append(el('h2', { className: 'serif', textContent: c.title }));
      if (c.price) body.append(el('p', { className: 'price', textContent: 'Học phí: ' + c.price }));
      if (c.summary) body.append(el('p', { className: 'summary', textContent: c.summary }));
      body.append(el('span', { className: 'cta', textContent: 'Xem và đăng ký' }));
      card.append(body);
      return card;
    }));
  } catch (e) {
    note('Không tải được danh sách khóa học. Bạn tải lại trang giúp mình nhé.');
  }
})();
</script>
</body>
</html>
