<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Kiểm tra trạng thái khóa học</title>
  <style>
    :root{color-scheme:light;--ink:#241712;--muted:#7a675c;--red:#b65c4b;--cream:#fff3e5;--bg:#faf7f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 8%,rgba(182,92,75,.12),transparent 25%),linear-gradient(180deg,var(--bg),#f3ece2)}
    .card{width:min(680px,100%);background:#fff;border:1px solid rgba(36,23,18,.10);border-radius:32px;padding:32px;box-shadow:0 24px 64px rgba(36,23,18,.12);text-align:center}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--cream);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
    h1{font-size:clamp(32px,7vw,54px);line-height:1.04;margin:22px 0 14px}
    p{font-size:17px;line-height:1.65;color:var(--muted);margin:0 auto;max-width:540px;font-weight:650}
    .actions{display:grid;gap:12px;margin-top:26px}
    a{display:block;text-decoration:none;border-radius:999px;padding:15px 20px;font-weight:850}
    #studentLink{background:var(--ink);color:#fff}
    #retryLink{background:var(--cream);color:var(--ink)}
    .hidden{display:none!important}
    .spinner{width:34px;height:34px;border:4px solid #eaded2;border-top-color:var(--red);border-radius:50%;margin:24px auto 0;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="badge"><span class="dot"></span><span id="badgeText">Đang kiểm tra</span></div>
    <h1 id="title">Đang kiểm tra trạng thái khóa học…</h1>
    <p id="message">Vui lòng chờ trong giây lát.</p>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <div id="actions" class="actions hidden">
      <a id="studentLink" class="hidden" href="#">Vào cổng học viên</a>
      <a id="retryLink" href="javascript:location.reload()">Kiểm tra lại</a>
    </div>
  </main>
  <script>
    (async()=>{
      const params=new URLSearchParams(window.location.search);
      const course=params.get('course');
      const badge=document.getElementById('badgeText');
      const title=document.getElementById('title');
      const message=document.getElementById('message');
      const spinner=document.getElementById('spinner');
      const actions=document.getElementById('actions');
      const studentLink=document.getElementById('studentLink');

      function showState(kind,text,detail){
        spinner.classList.add('hidden');
        actions.classList.remove('hidden');
        badge.textContent=kind;
        title.textContent=text;
        message.textContent=detail;
      }

      if(!course){
        window.location.replace('/index.html');
        return;
      }

      try{
        const response=await fetch(`/api/config?course=${encodeURIComponent(course)}`,{cache:'no-store'});
        const data=await response.json().catch(()=>({}));

        if(response.ok){
          window.location.replace(`/index.html${window.location.search}`);
          return;
        }

        if(data.code==='sale_paused'){
          showState('Tạm dừng bán','Khóa học hiện đang tạm dừng nhận đăng ký','Hiện tại hệ thống không nhận thanh toán hoặc bill mới cho khóa học này. Học viên đã được cấp quyền học vẫn sử dụng cổng học viên bình thường.');
          try{
            const runtimeResponse=await fetch('/api/config?runtime=1',{cache:'no-store'});
            if(runtimeResponse.ok){
              const runtime=await runtimeResponse.json();
              if(runtime.lmsPublicUrl){
                studentLink.href=new URL('/my-courses.html',runtime.lmsPublicUrl).toString();
                studentLink.classList.remove('hidden');
              }
            }
          }catch(_error){}
          return;
        }

        showState('Chưa mở đăng ký','Khóa học hiện chưa nhận đăng ký',data.error||'Vui lòng quay lại sau hoặc liên hệ Admin nếu bạn cần hỗ trợ.');
      }catch(error){
        showState('Không kết nối được','Chưa kiểm tra được trạng thái khóa học','Vui lòng thử lại sau. Hệ thống chưa thực hiện bất kỳ giao dịch hoặc upload bill nào.');
      }
    })();
  </script>
</body>
</html>
