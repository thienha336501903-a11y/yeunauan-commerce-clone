<div class="yb-scrim" id="ybScrim"></div>
<script>
  // Shell only: active link, mobile drawer, LMS links from /api/config?runtime=1, logout (same key the page uses).
  (function () {
    var page = document.body.getAttribute('data-page');
    document.querySelectorAll('.yb-nav a[data-nav]').forEach(function (a) { if (a.dataset.nav === page) a.setAttribute('aria-current', 'page'); });
    var toggle = function (open) { document.body.classList.toggle('yb-nav-open', open); };
    document.addEventListener('click', function (e) {
      if (e.target.closest('#ybMenuBtn')) toggle(!document.body.classList.contains('yb-nav-open'));
      else if (e.target.closest('#ybScrim') || e.target.closest('.yb-nav a')) toggle(false);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
    document.getElementById('ybLogout').addEventListener('click', function () {
      try { sessionStorage.removeItem('admin_password'); } catch (e) {}
      location.reload();
    });
    fetch('/api/config?runtime=1', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (cfg) {
      if (!cfg) return;
      var shown = false;
      document.querySelectorAll('#ybLmsLinks a[data-lms]').forEach(function (a) {
        var base = String(cfg[a.dataset.lms] || '').replace(/\/$/, '');
        if (/^https:\/\//.test(base)) { a.href = base + a.dataset.path; shown = true; } else a.remove();
      });
      document.getElementById('ybLmsLinks').hidden = !shown;
    }).catch(function () {});
  })();
</script>
