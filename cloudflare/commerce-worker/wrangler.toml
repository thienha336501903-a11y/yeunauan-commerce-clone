# SYSTEM B commerce Worker (H1). No routes and no workers.dev: deploying this file serves nothing until a later,
# separately approved step adds the hostnames. Secrets are set with `wrangler secret put`, never stored here.
name = "systemb-commerce"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

[vars]
NODE_ENV = "production"
MESSENGER_BOT_ENABLED = "0"
MESSENGER_COURSE_SLUGS = "clone-factory-test-phase2-range-20260907"
MESSENGER_APPROVE_SLA = "24 giờ"
META_APP_ID = ""
META_PAGE_ID = ""

# Messenger bot (H4). Off until a separate Owner gate sets MESSENGER_BOT_ENABLED = "1".
# Secrets (wrangler secret put, by name): META_APP_SECRET, META_VERIFY_TOKEN, META_PAGE_ACCESS_TOKEN.
# MESSENGER_COURSE_SLUGS = comma list of courses the bot may sell; selling a real course is its own gate.
[[durable_objects.bindings]]
name = "MESSENGER_CONVERSATIONS"
class_name = "MessengerConversation"

[[migrations]]
tag = "h4-messenger-v1"
new_sqlite_classes = ["MessengerConversation"]
