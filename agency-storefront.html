<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agency Academy</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#201a17;background:#f7f4ef}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:28px}.muted{color:#756b64;font-size:13px}
.card{background:#fff;border:1px solid #e7dfd8;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(50,35,25,.05)}
.offer{display:grid;gap:8px}.price{font-size:22px;font-weight:800}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:#2f6240;color:#fff}
.btn.secondary{background:#eee8e2;color:#493d36}.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:10px 12px;border-radius:12px;background:#f2eee9;font-size:13px}
.error{background:#fff0f0;color:#8d3030}.ok{background:#edf8ef;color:#286337}
#qr{max-width:280px;width:100%;border-radius:18px;background:#fff;padding:8px;border:1px solid #eee}
.hidden{display:none!important}code{word-break:break-all;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="brand">Agency Academy</h1>
    <div id="subtitle" class="muted">Đang tải...</div>
  </div>
  <button id="logout" class="btn secondary hidden" type="button">Đăng xuất</button>
</header>

<div id="notice" class="card status">Đang tải cấu hình Agency…</div>

<section id="authCard" class="card hidden">
  <strong>Đăng nhập để thanh toán</strong>
  <p class="muted">Dùng đúng Google account đã có membership trong Agency.</p>
  <button id="googleLogin" class="btn" type="button" disabled>Đang chuẩn bị Google…</button>
</section>

<section id="memberCard" class="card hidden">
  <div><strong id="memberName"></strong></div>
  <div id="memberEmail" class="muted"></div>
</section>

<section>
  <h2>Khóa học</h2>
  <div id="offers"></div>
</section>

<section id="payment" class="card hidden">
  <h2>Thanh toán</h2>
  <div id="orderStatus" class="status"></div>
  <p><strong>Số tiền:</strong> <span id="amount"></span></p>
  <p><strong>Ngân hàng:</strong> <span id="bank"></span></p>
  <p><strong>Số tài khoản:</strong> <span id="account"></span></p>
  <p><strong>Chủ tài khoản:</strong> <span id="holder"></span></p>
  <p><strong>Nội dung:</strong> <span id="transfer"></span></p>
  <img id="qr" alt="QR chuyển khoản">
  <p><code id="orderId"></code></p>
  <div class="row">
    <button id="refreshOrder" class="btn secondary" type="button">Kiểm tra trạng thái</button>
  </div>
</section>
</div>

<script>
let config=null,tokenClient=null,currentOrderId='';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' đ';

function setNotice(message,type=''){
  $('notice').textContent=message;
  $('notice').className='card status '+type;
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadConfig(){
  const r=await fetch('/api/config?runtime=1',{credentials:'same-origin',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.success||!d.agency) throw new Error(d.error||'Agency configuration unavailable');
  config=d;
  $('brand').textContent=d.agency.brand_name||d.agency.name||'Agency Academy';
  $('subtitle').textContent=d.agency.name||'';
  renderOffers();
  return d;
}

function renderOffers(){
  const items=Array.isArray(config?.offerings)?config.offerings:[];
  $('offers').innerHTML=items.length?items.map(o=>`
    <article class="card offer">
      <strong>${esc(o.display_title||o.slug)}</strong>
      <div class="muted">${esc(o.display_description||'')}</div>
      <div class="price">${money(o.sale_price_vnd??o.price_vnd)}</div>
      <button class="btn" type="button" data-buy="${esc(o.id)}">Thanh toán</button>
    </article>`).join(''):'<div class="card">Chưa có offering đang mở.</div>';
  document.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>checkout(btn.dataset.buy,btn)));
}

async function session(){
  const r=await fetch('/api/agency-session',{credentials:'same-origin',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.success){
    $('authCard').classList.add('hidden');
    $('memberCard').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('memberName').textContent=d.member.displayName||d.member.role||'Học viên';
    $('memberEmail').textContent=d.member.email||'';
    setNotice('Đã đăng nhập Agency.','ok');
    return true;
  }
  $('authCard').classList.remove('hidden');
  $('memberCard').classList.add('hidden');
  $('logout').classList.add('hidden');
  setNotice('Vui lòng đăng nhập để tiếp tục.');
  return false;
}

function googleReady(){return !!window.google?.accounts?.oauth2}
async function prepareGoogle(){
  if(!config?.googleClientId){$('googleLogin').textContent='Google OAuth chưa cấu hình';return}
  for(let i=0;i<50&&!googleReady();i++) await new Promise(r=>setTimeout(r,100));
  if(!googleReady()){ $('googleLogin').textContent='Không tải được Google'; return; }
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:config.googleClientId,
    scope:'openid email profile',
    prompt:'select_account',
    callback:async resp=>{
      if(!resp?.access_token){setNotice('Không nhận được Google token.','error');return}
      setNotice('Đang xác thực Google…');
      const r=await fetch('/api/agency-session',{
        method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({accessToken:resp.access_token})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.success){setNotice(d.error||'Đăng nhập thất bại.','error');return}
      await session();
    },
    error_callback:()=>setNotice('Google chưa hoàn tất đăng nhập.','error')
  });
  $('googleLogin').disabled=false;
  $('googleLogin').textContent='Đăng nhập Google';
}

async function checkout(offeringId,button){
  button.disabled=true;
  try{
    const r=await fetch('/api/register',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({offeringId})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.success){
      if(r.status===401){await session();throw new Error('Vui lòng đăng nhập trước khi thanh toán.')}
      throw new Error(d.error||'Không tạo được đơn Agency.');
    }
    showOrder(d.order);
  }catch(e){setNotice(e.message||String(e),'error')}
  finally{button.disabled=false}
}

function showOrder(order){
  currentOrderId=String(order?.orderId||'');
  if(currentOrderId) localStorage.setItem('agency_last_order_id',currentOrderId);
  $('payment').classList.remove('hidden');
  $('orderStatus').textContent='Trạng thái: '+String(order?.status||'pending');
  $('amount').textContent=money(order?.amountVnd);
  $('bank').textContent=order?.bankCode||'';
  $('account').textContent=order?.accountNumber||'';
  $('holder').textContent=order?.accountHolder||'';
  $('transfer').textContent=order?.transferContent||'';
  $('orderId').textContent=currentOrderId?'Order ID: '+currentOrderId:'';
  if(order?.vietQrUrl){$('qr').src=order.vietQrUrl;$('qr').classList.remove('hidden')}
  else $('qr').classList.add('hidden');
  setNotice('Đơn Agency đã được tạo trên Main.','ok');
  $('payment').scrollIntoView({behavior:'smooth',block:'start'});
}

async function refreshOrder(){
  currentOrderId=currentOrderId||localStorage.getItem('agency_last_order_id')||'';
  if(!currentOrderId)return;
  const r=await fetch('/api/orders?id='+encodeURIComponent(currentOrderId),{credentials:'same-origin',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.success){setNotice(d.error||'Không đọc được đơn.','error');return}
  $('orderStatus').textContent='Trạng thái: '+String(d.order?.status||'');
  setNotice('Đã cập nhật trạng thái đơn.','ok');
}

$('googleLogin').addEventListener('click',()=>tokenClient?.requestAccessToken({prompt:'select_account'}));
$('logout').addEventListener('click',async()=>{
  await fetch('/api/agency-session',{method:'DELETE',credentials:'same-origin'});
  localStorage.removeItem('agency_last_order_id');
  currentOrderId='';
  $('payment').classList.add('hidden');
  await session();
});
$('refreshOrder').addEventListener('click',refreshOrder);

(async()=>{
  try{
    await loadConfig();
    await session();
    await prepareGoogle();
    currentOrderId=localStorage.getItem('agency_last_order_id')||'';
    if(currentOrderId) $('payment').classList.remove('hidden');
  }catch(e){setNotice(e.message||String(e),'error')}
})();
</script>
</body>
</html>
