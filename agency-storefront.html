<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agency Academy</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#201a17;background:#f7f4ef}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:28px}.muted{color:#756b64;font-size:13px}
.card{background:#fff;border:1px solid #e7dfd8;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(50,35,25,.05)}
.offer{display:grid;gap:8px}.price{font-size:22px;font-weight:800}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:#2f6240;color:#fff}
.btn.secondary{background:#eee8e2;color:#493d36}.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:10px 12px;border-radius:12px;background:#f2eee9;font-size:13px}
.error{background:#fff0f0;color:#8d3030}.ok{background:#edf8ef;color:#286337}
#qr{max-width:280px;width:100%;border-radius:18px;background:#fff;padding:8px;border:1px solid #eee}
.hidden{display:none!important}code{word-break:break-all;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="brand">Agency Academy</h1>
    <div id="subtitle" class="muted">Đang tải...</div>
  </div>
  <button id="logout" class="btn secondary hidden" type="button">Đăng xuất</button>
</header>

<div id="notice" class="card status">Đang tải cấu hình Agency…</div>

<section id="authCard" class="card hidden">
  <strong>Đăng nhập để thanh toán</strong>
  <p class="muted">Dùng đúng Google account đã có membership trong Agency.</p>
  <button id="googleLogin" class="btn" type="button" disabled>Đang chuẩn bị Google…</button>
</section>

<section id="memberCard" class="card hidden">
  <div><strong id="memberName"></strong></div>
  <div id="memberEmail" class="muted"></div>
  <div class="row" style="margin-top:12px"><a id="lmsLink" class="btn secondary" href="#" rel="noopener">Vào cổng học viên</a></div>
</section>

<section>
  <h2>Khóa học</h2>
  <div id="offers"></div>
</section>

<section id="payment" class="card hidden">
  <h2>Thanh toán</h2>
  <div id="orderStatus" class="status"></div>
  <p><strong>Số tiền:</strong> <span id="amount"></span></p>
  <p><strong>Ngân hàng:</strong> <span id="bank"></span></p>
  <p><strong>Số tài khoản:</strong> <span id="account"></span></p>
  <p><strong>Chủ tài khoản:</strong> <span id="holder"></span></p>
  <p><strong>Nội dung:</strong> <span id="transfer"></span></p>
  <img id="qr" alt="QR chuyển khoản">
  <p><code id="orderId"></code></p>
  <div class="row">
    <button id="refreshOrder" class="btn secondary" type="button">Kiểm tra trạng thái</button>
  </div>
</section>
</div>

<script>
let config=null,tokenClient=null,currentOrderId='',currentMembershipId='';
let actorEpoch=0,sessionRequestSeq=0,accountSessionBroadcast=null;
let googlePrepared=false,loginAttemptSeq=0,activeLoginAttempt=null;
let sessionWriteQueue=Promise.resolve(),sessionWritesPending=0,sessionReconciliationRequired=false;
let currentActorIntent='';
const ACCOUNT_SESSION_CHANNEL='system-b-agency-commerce-session-v1';
const SESSION_INTENT_KEY=ACCOUNT_SESSION_CHANNEL+':intent';
let currentSessionIntent='';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' đ';

function actorSnapshot(){
  return Object.freeze({
    agencyId:String(config?.agency?.id||'').trim(),
    memberId:String(currentMembershipId||'').trim(),
    intent:String(currentActorIntent||'').trim(),
    epoch:actorEpoch
  });
}
function actorIsCurrent(actor){
  const shared=sharedSessionIntent();
  return !!actor&&
    actor.epoch===actorEpoch&&
    actor.agencyId===String(config?.agency?.id||'').trim()&&
    actor.memberId===String(currentMembershipId||'').trim()&&
    !!actor.intent&&
    actor.intent===currentActorIntent&&
    (!shared||shared===actor.intent)&&
    !!actor.agencyId&&!!actor.memberId;
}
function storagePrefix(actor=actorSnapshot()){
  const agencyId=String(actor?.agencyId||'').trim();
  const member=String(actor?.memberId||'').trim();
  return agencyId&&member?`agency:${agencyId}:${member}:`:'';
}
function lastOrderKey(actor=actorSnapshot()){const p=storagePrefix(actor);return p?p+'last_order':''}
function checkoutIntentKey(offeringId,actor=actorSnapshot()){const p=storagePrefix(actor);return p?p+'checkout:'+String(offeringId||'').trim():''}
function clearCurrentAccountStorage(actor=actorSnapshot()){
  const prefix=storagePrefix(actor);
  if(!prefix)return;
  try{for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(key&&key.startsWith(prefix))localStorage.removeItem(key)}}catch{}
}
function logicalCheckoutKey(offeringId,actor=actorSnapshot()){
  if(!actorIsCurrent(actor))throw new Error('Phiên Agency đã thay đổi. Vui lòng thử lại.');
  const key=checkoutIntentKey(offeringId,actor);
  if(!key)throw new Error('Vui lòng đăng nhập trước khi thanh toán.');
  let value='';
  try{value=localStorage.getItem(key)||''}catch{}
  if(!value){value='AG-'+crypto.randomUUID();try{localStorage.setItem(key,value)}catch{}}
  return value;
}
function clearCheckoutIntent(offeringId,actor=actorSnapshot()){
  const key=checkoutIntentKey(offeringId,actor);
  if(!key)return;
  try{localStorage.removeItem(key)}catch{}
}
function clearPaymentState(){
  currentOrderId='';
  $('payment').classList.add('hidden');
  for(const id of ['orderStatus','amount','bank','account','holder','transfer','orderId'])$(id).textContent='';
  $('qr').removeAttribute('src');
  $('qr').classList.add('hidden');
}
function showLoggedOutState(){
  $('authCard').classList.remove('hidden');
  $('memberCard').classList.add('hidden');
  $('logout').classList.add('hidden');
}
function updateGoogleLoginButton(){
  $('googleLogin').disabled=!googlePrepared||!!activeLoginAttempt||sessionWritesPending>0;
}
function sharedSessionIntent(){
  try{return localStorage.getItem(SESSION_INTENT_KEY)||''}catch{return ''}
}
function beginSessionIntent(){
  currentSessionIntent=crypto.randomUUID();
  // Only a transition nonce is shared; credentials and account context remain
  // in this tab/server. This also rejects stale writes before delayed BC events.
  try{localStorage.setItem(SESSION_INTENT_KEY,currentSessionIntent)}catch{}
  return currentSessionIntent;
}
function sessionIntentIsCurrent(intent){
  const shared=sharedSessionIntent();
  return !!intent&&intent===currentSessionIntent&&(!shared||shared===intent);
}
function sessionSerializationAvailable(){
  return typeof window.navigator?.locks?.request==='function';
}
function adoptSharedSessionIntent(){
  const shared=sharedSessionIntent();
  if(shared){
    currentSessionIntent=shared;
    return shared;
  }
  return beginSessionIntent();
}
function staleActorError(){
  const error=new Error('Phiên Agency đã thay đổi. Vui lòng thử lại.');
  error.code='stale_agency_actor';
  return error;
}
async function withProtectedSessionLock(actor,work){
  if(!sessionSerializationAvailable())throw new Error('Trình duyệt không hỗ trợ khóa phiên an toàn. Vui lòng dùng trình duyệt mới hơn.');
  if(!actorIsCurrent(actor))throw staleActorError();
  return window.navigator.locks.request(ACCOUNT_SESSION_CHANNEL+':writes',async()=>{
    if(!actorIsCurrent(actor))throw staleActorError();
    const result=await work();
    if(!actorIsCurrent(actor))throw staleActorError();
    return result;
  });
}
function cancelGoogleLogin(){
  loginAttemptSeq+=1;
  activeLoginAttempt=null;
  updateGoogleLoginButton();
}
function loginAttemptIsCurrent(attempt){
  return !!attempt&&activeLoginAttempt===attempt&&attempt.version===loginAttemptSeq&&sessionIntentIsCurrent(attempt.intent);
}
function enqueueSessionWrite(work){
  if(!sessionSerializationAvailable()){
    return Promise.reject(new Error('Trình duyệt không hỗ trợ khóa phiên an toàn. Vui lòng dùng trình duyệt mới hơn.'));
  }
  sessionWritesPending+=1;
  updateGoogleLoginButton();
  const previous=sessionWriteQueue;
  const run=()=>previous.then(()=>work(true),()=>work(true));
  // Reserve the cross-tab lock immediately. No credential-changing POST is
  // allowed on browsers that cannot provide this serialization boundary.
  const queued=window.navigator.locks.request(ACCOUNT_SESSION_CHANNEL+':writes',run);
  const result=queued.finally(()=>{
    sessionWritesPending-=1;
    updateGoogleLoginButton();
  });
  sessionWriteQueue=result.catch(()=>{});
  return result;
}
async function clearSessionCookie(){
  sessionReconciliationRequired=true;
  const r=await fetch('/api/config?agencySession=1',{method:'DELETE',credentials:'same-origin',cache:'no-store'});
  if(!r.ok)throw new Error('Chưa hoàn tất đăng xuất. Vui lòng thử lại.');
  sessionReconciliationRequired=false;
}
function accountSessionChannel(){
  if(!('BroadcastChannel'in window))return null;
  if(!accountSessionBroadcast){
    accountSessionBroadcast=new BroadcastChannel(ACCOUNT_SESSION_CHANNEL);
    accountSessionBroadcast.addEventListener('message',event=>{
      if(event.data?.type!=='clear')return;
      // An older tab's notification can arrive after this tab's newer intent.
      // Ignore it only when the shared nonce confirms our pending intent; a
      // compensating cookie deletion always invalidates, including in fallback.
      const eventIntent=String(event.data.intent||'');
      const shared=sharedSessionIntent();
      if(!event.data.reconcile&&eventIntent){
        if(activeLoginAttempt&&shared===activeLoginAttempt.intent&&eventIntent!==activeLoginAttempt.intent)return;
        if(currentActorIntent&&shared===currentActorIntent&&eventIntent!==currentActorIntent)return;
      }
      invalidateActorState({broadcast:false});
      setNotice('Phiên Agency đã thay đổi ở tab khác. Vui lòng đăng nhập lại.');
    });
  }
  return accountSessionBroadcast;
}
function invalidateActorState({broadcast=true,clearStorage=false}={}){
  cancelGoogleLogin();
  const previous=actorSnapshot();
  if(clearStorage)clearCurrentAccountStorage(previous);
  actorEpoch+=1;
  currentMembershipId='';
  currentActorIntent='';
  clearPaymentState();
  showLoggedOutState();
  if(broadcast){try{accountSessionChannel()?.postMessage({type:'clear',intent:currentSessionIntent})}catch{}}
}
function activateActor(memberId,intent){
  const next=String(memberId||'').trim();
  const acceptedIntent=String(intent||'').trim();
  if(!next||!acceptedIntent||acceptedIntent!==sharedSessionIntent())return false;
  if(currentMembershipId!==next||currentActorIntent!==acceptedIntent){
    actorEpoch+=1;
    currentMembershipId=next;
    currentActorIntent=acceptedIntent;
    currentSessionIntent=acceptedIntent;
    clearPaymentState();
    try{accountSessionChannel()?.postMessage({type:'clear',intent:acceptedIntent})}catch{}
  }
  return true;
}

function setNotice(message,type=''){
  $('notice').textContent=message;
  $('notice').className='card status '+type;
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadConfig(){
  const r=await fetch('/api/config?runtime=1',{credentials:'same-origin',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.success||!d.agency) throw new Error(d.error||'Agency configuration unavailable');
  config=d;
  $('brand').textContent=d.agency.brand_name||d.agency.name||'Agency Academy';
  $('subtitle').textContent=d.agency.name||'';
  renderOffers();
  return d;
}

function renderOffers(){
  const items=Array.isArray(config?.offerings)?config.offerings:[];
  $('offers').innerHTML=items.length?items.map(o=>`
    <article class="card offer">
      <strong>${esc(o.display_title||o.slug)}</strong>
      <div class="muted">${esc(o.display_description||'')}</div>
      <div class="price">${money(o.sale_price_vnd??o.price_vnd)}</div>
      <button class="btn" type="button" data-buy="${esc(o.id)}">Thanh toán</button>
    </article>`).join(''):'<div class="card">Chưa có offering đang mở.</div>';
  document.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>checkout(btn.dataset.buy,btn)));
}

async function session(expectedAttempt=null,expectedPrincipal=null){
  if(!sessionSerializationAvailable()){
    invalidateActorState({broadcast:false});
    setNotice('Trình duyệt không hỗ trợ khóa phiên an toàn. Không thể mở phiên Agency.','error');
    return false;
  }
  if(sessionReconciliationRequired||sessionWritesPending>0&&!loginAttemptIsCurrent(expectedAttempt))return false;
  const requestSeq=++sessionRequestSeq;
  const startEpoch=actorEpoch;
  const startIntent=expectedAttempt?.intent||currentSessionIntent||sharedSessionIntent()||adoptSharedSessionIntent();
  const r=await fetch('/api/config?agencySession=1',{credentials:'same-origin',cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(requestSeq!==sessionRequestSeq||startEpoch!==actorEpoch||startIntent!==sharedSessionIntent()||expectedAttempt&&!loginAttemptIsCurrent(expectedAttempt))return false;

  if(r.ok&&d.success){
    const nextMember=String(d.member?.id||'').trim();
    const nextUser=String(d.member?.userId||'').trim();
    if(!nextMember){
      invalidateActorState({broadcast:true});
      setNotice('Phiên Agency không hợp lệ.','error');
      return false;
    }
    if(expectedPrincipal){
      const expectedMember=String(expectedPrincipal.membershipId||'').trim();
      const expectedUser=String(expectedPrincipal.userId||'').trim();
      if(!expectedMember||nextMember!==expectedMember||expectedUser&&nextUser!==expectedUser){
        invalidateActorState({broadcast:true});
        sessionReconciliationRequired=true;
        await clearSessionCookie();
        setNotice('BLOCKED: Phiên đăng nhập không khớp tài khoản Google vừa xác thực.','error');
        return false;
      }
    }
    if(!activateActor(nextMember,startIntent)){
      invalidateActorState({broadcast:true});
      setNotice('BLOCKED: Phiên Agency đã thay đổi.','error');
      return false;
    }
    $('authCard').classList.add('hidden');
    $('memberCard').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('memberName').textContent=d.member.displayName||d.member.role||'Học viên';
    $('memberEmail').textContent=d.member.email||'';
    if(config?.lmsPublicUrl){
      $('lmsLink').href=new URL('/my-courses.html',config.lmsPublicUrl).toString();
    }
    clearPaymentState();
    const actor=actorSnapshot();
    const key=lastOrderKey(actor);
    currentOrderId=key?localStorage.getItem(key)||'':'';
    if(currentOrderId){
      $('payment').classList.remove('hidden');
      $('orderStatus').textContent='Đơn gần nhất đã lưu cho tài khoản này.';
      $('orderId').textContent='Order ID: '+currentOrderId;
    }
    setNotice('Đã đăng nhập Agency.','ok');
    return true;
  }

  if(currentMembershipId)invalidateActorState({broadcast:true});
  else{
    clearPaymentState();
    showLoggedOutState();
  }
  setNotice('Vui lòng đăng nhập để tiếp tục.');
  return false;
}

function googleReady(){return !!window.google?.accounts?.oauth2}
async function completeGoogleLogin(resp,attempt){
  if(!loginAttemptIsCurrent(attempt)||attempt.callbackStarted)return;
  attempt.callbackStarted=true;
  try{
    if(!resp?.access_token)throw new Error('Không nhận được Google token.');
    setNotice('Đang xác thực Google…');
    await enqueueSessionWrite(async crossTabLocked=>{
      if(!loginAttemptIsCurrent(attempt))return;
      if(sessionReconciliationRequired)await clearSessionCookie();
      if(!loginAttemptIsCurrent(attempt))return;
      let posted=false;
      try{
        posted=true;
        const r=await fetch('/api/config?agencySession=1',{
          method:'POST',credentials:'same-origin',cache:'no-store',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({accessToken:resp.access_token})
        });
        const d=await r.json().catch(()=>({}));
        if(!loginAttemptIsCurrent(attempt))return;
        if(!r.ok||!d.success)throw new Error(d.error||'Đăng nhập thất bại.');
        const expectedPrincipal={
          membershipId:String(d.membershipId||'').trim(),
          userId:String(d.userId||'').trim()
        };
        if(!expectedPrincipal.membershipId||!expectedPrincipal.userId)throw new Error('Phản hồi đăng nhập thiếu principal binding.');
        await session(attempt,expectedPrincipal);
      }finally{
        // A discarded POST can already have applied HttpOnly Set-Cookie.
        // Reconcile before releasing the write queue/lock, rather than aborting
        // the request or merely ignoring its JSON response.
        if(posted&&!loginAttemptIsCurrent(attempt)){
          await clearSessionCookie();
          // Without cross-tab locks, another tab may have been overwritten by
          // this late cookie. Invalidate its UI after the compensating DELETE.
          if(!crossTabLocked){try{accountSessionChannel()?.postMessage({type:'clear',reconcile:true})}catch{}}
        }
      }
    });
  }catch(error){
    if(loginAttemptIsCurrent(attempt)||sessionReconciliationRequired)setNotice(error.message||'Đăng nhập thất bại.','error');
  }finally{
    if(activeLoginAttempt===attempt)activeLoginAttempt=null;
    updateGoogleLoginButton();
  }
}
function beginGoogleLogin(){
  if(!googlePrepared||activeLoginAttempt||sessionWritesPending>0)return;
  if(!sessionSerializationAvailable()){
    invalidateActorState({broadcast:false});
    setNotice('Trình duyệt không hỗ trợ khóa phiên an toàn. Google login bị chặn.','error');
    return;
  }
  const intent=beginSessionIntent();
  invalidateActorState({broadcast:true});
  const attempt={version:++loginAttemptSeq,intent,callbackStarted:false};
  activeLoginAttempt=attempt;
  updateGoogleLoginButton();
  try{
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:config.googleClientId,
      scope:'openid email profile',
      prompt:'select_account',
      callback:resp=>completeGoogleLogin(resp,attempt),
      error_callback:()=>{
        if(!loginAttemptIsCurrent(attempt))return;
        cancelGoogleLogin();
        setNotice('Google chưa hoàn tất đăng nhập.','error');
      }
    });
    tokenClient.requestAccessToken({prompt:'select_account'});
  }catch(error){
    cancelGoogleLogin();
    setNotice(error.message||'Google chưa hoàn tất đăng nhập.','error');
  }
}
async function prepareGoogle(){
  if(!config?.googleClientId){$('googleLogin').textContent='Google OAuth chưa cấu hình';return}
  if(!sessionSerializationAvailable()){
    $('googleLogin').textContent='Trình duyệt chưa hỗ trợ phiên an toàn';
    $('googleLogin').disabled=true;
    return;
  }
  for(let i=0;i<50&&!googleReady();i++) await new Promise(r=>setTimeout(r,100));
  if(!googleReady()){ $('googleLogin').textContent='Không tải được Google'; return; }
  googlePrepared=true;
  updateGoogleLoginButton();
  $('googleLogin').textContent='Đăng nhập Google';
}

async function checkout(offeringId,button){
  const actor=actorSnapshot();
  button.disabled=true;
  try{
    await withProtectedSessionLock(actor,async()=>{
      if(!actorIsCurrent(actor))throw staleActorError();
      const idempotencyOrderCode=logicalCheckoutKey(offeringId,actor);
      const r=await fetch('/api/register',{
        method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({offeringId,idempotencyOrderCode})
      });
      const d=await r.json().catch(()=>({}));
      if(!actorIsCurrent(actor))throw staleActorError();
      if(!r.ok||!d.success){
        if(r.status===401){
          invalidateActorState({broadcast:true});
          throw new Error('Vui lòng đăng nhập trước khi thanh toán.');
        }
        throw new Error(d.error||'Không tạo được đơn Agency.');
      }
      if(!showOrder(d.order,actor))throw staleActorError();
      if(actorIsCurrent(actor))clearCheckoutIntent(offeringId,actor);
    });
  }catch(e){
    if(e?.code!=='stale_agency_actor'&&(actorIsCurrent(actor)||!currentMembershipId))setNotice(e.message||String(e),'error');
  }finally{
    if(button?.isConnected)button.disabled=false;
  }
}

function showOrder(order,actor=actorSnapshot()){
  if(!actorIsCurrent(actor))return false;
  currentOrderId=String(order?.orderId||'');
  const key=lastOrderKey(actor);
  if(currentOrderId&&key)localStorage.setItem(key,currentOrderId);
  $('payment').classList.remove('hidden');
  $('orderStatus').textContent='Trạng thái: '+String(order?.status||'pending');
  $('amount').textContent=money(order?.amountVnd);
  $('bank').textContent=order?.bankCode||'';
  $('account').textContent=order?.accountNumber||'';
  $('holder').textContent=order?.accountHolder||'';
  $('transfer').textContent=order?.transferContent||'';
  $('orderId').textContent=currentOrderId?'Order ID: '+currentOrderId:'';
  if(order?.vietQrUrl){$('qr').src=order.vietQrUrl;$('qr').classList.remove('hidden')}
  else{$('qr').removeAttribute('src');$('qr').classList.add('hidden')}
  setNotice('Đơn Agency đã được tạo trên Main.','ok');
  $('payment').scrollIntoView({behavior:'smooth',block:'start'});
  return true;
}

async function refreshOrder(){
  const actor=actorSnapshot();
  if(!actorIsCurrent(actor))return;
  try{
    await withProtectedSessionLock(actor,async()=>{
      if(!actorIsCurrent(actor))throw staleActorError();
      const key=lastOrderKey(actor);
      const orderId=currentOrderId||(key?localStorage.getItem(key)||'':'');
      if(!orderId)return;
      const r=await fetch('/api/orders?id='+encodeURIComponent(orderId),{credentials:'same-origin',cache:'no-store'});
      const d=await r.json().catch(()=>({}));
      if(!actorIsCurrent(actor))throw staleActorError();
      if(orderId!==currentOrderId&&currentOrderId)return;
      if(!r.ok||!d.success){
        if(r.status===401)invalidateActorState({broadcast:true});
        else setNotice(d.error||'Không đọc được đơn.','error');
        return;
      }
      if(!actorIsCurrent(actor))throw staleActorError();
      $('orderStatus').textContent='Trạng thái: '+String(d.order?.status||'');
      setNotice('Đã cập nhật trạng thái đơn.','ok');
    });
  }catch(e){
    if(e?.code!=='stale_agency_actor'&&(actorIsCurrent(actor)||!currentMembershipId))setNotice(e.message||String(e),'error');
  }
}

$('googleLogin').addEventListener('click',beginGoogleLogin);
$('logout').addEventListener('click',async()=>{
  beginSessionIntent();
  const actor=actorSnapshot();
  clearCurrentAccountStorage(actor);
  invalidateActorState({broadcast:true});
  sessionReconciliationRequired=true;
  const logoutEpoch=actorEpoch;
  setNotice('Đang đăng xuất…');
  try{
    if(sessionSerializationAvailable()){
      await enqueueSessionWrite(async()=>{
        await clearSessionCookie();
        if(logoutEpoch===actorEpoch)setNotice('Đã đăng xuất Agency.');
      });
    }else{
      await clearSessionCookie();
      try{accountSessionChannel()?.postMessage({type:'clear',reconcile:true,intent:currentSessionIntent})}catch{}
      if(logoutEpoch===actorEpoch)setNotice('Đã đăng xuất Agency.');
    }
  }catch(error){setNotice(error.message||'Chưa hoàn tất đăng xuất. Vui lòng thử lại.','error')}
});
$('refreshOrder').addEventListener('click',refreshOrder);

(async()=>{
  try{
    accountSessionChannel();
    adoptSharedSessionIntent();
    await loadConfig();
    await session();
    await prepareGoogle();
  }catch(e){setNotice(e.message||String(e),'error')}
})();
</script>
